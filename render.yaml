services:
  - type: web
    name: lendsqr-wallet-service
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    # The free plan has no pre-deploy command, so migrations run at start. Knex takes a migration lock, so this is safe.
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        fromDatabase:
          name: lendsqr-wallet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: BLACKLIST_PROVIDER
        value: mock
      - key: MOCK_BLACKLIST
        value: blacklisted@example.com,+2348000000000
      - key: ADJUTOR_API_KEY
        sync: false

databases:
  - name: lendsqr-wallet-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '18'
